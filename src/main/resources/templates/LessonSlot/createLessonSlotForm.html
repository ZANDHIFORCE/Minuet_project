<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>레슨 시간표 등록 - Minuet</title>
    <style>
        body { max-width: 640px; margin: 32px auto; padding: 0 16px; font-family: sans-serif; line-height: 1.6; }
        label { display: block; font-weight: bold; }
        input, select, button { font: inherit; padding: 8px; }
        .error { color: #a4161a; margin: 4px 0; }
        .field-error { border: 2px solid #a4161a; }
        .error-summary { padding: 12px; background: #fff1f1; border: 1px solid #a4161a; }
    </style>
</head>
<body>
<h1>레슨 시간표 등록</h1>
<p><a href="/">홈으로</a> | <a href="/LessonSlot/list">시간표 목록</a></p>
<p>같은 요일에 선생님이나 학생의 수업 시간이 겹치면 등록할 수 없습니다. 앞 수업이 끝나는 시각에는 다음 수업을 시작할 수 있습니다.</p>
<form th:action="@{/LessonSlot/new}" method="post" th:object="${lessonSlot}">
    <div class="error-summary" role="alert" th:if="${#fields.hasAnyErrors()}">
        <strong>입력 내용을 확인해 주세요.</strong>
        <p class="error" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    </div>
    <fieldset>
        <legend>레슨 정보</legend>
        <p>
            <label for="teacherId">선생님 ID</label>
            <input type="number" th:field="*{teacherId}" th:errorclass="field-error" min="1" required aria-describedby="teacherIdError">
            <span id="teacherIdError" class="error" th:errors="*{teacherId}"></span>
            <a href="/Teacher/list">선생님 목록 확인</a>
        </p>
        <p>
            <label for="studentId">학생 ID</label>
            <input type="number" th:field="*{studentId}" th:errorclass="field-error" min="1" required aria-describedby="studentIdError">
            <span id="studentIdError" class="error" th:errors="*{studentId}"></span>
            <a href="/Student/list">학생 목록 확인</a>
        </p>
        <p>
            <label for="day">요일</label>
            <select th:field="*{day}" th:errorclass="field-error" required aria-describedby="dayError">
                <option value="">요일을 선택하세요</option>
                <option value="0">월요일</option>
                <option value="1">화요일</option>
                <option value="2">수요일</option>
                <option value="3">목요일</option>
                <option value="4">금요일</option>
                <option value="5">토요일</option>
                <option value="6">일요일</option>
            </select>
            <span id="dayError" class="error" th:errors="*{day}"></span>
        </p>
        <p>
            <label for="time">시작 시각</label>
            <input type="time" th:field="*{time}" th:errorclass="field-error" step="60" required aria-describedby="timeError">
            <span id="timeError" class="error" th:errors="*{time}"></span>
        </p>
        <p>
            <label for="durationMinutes">수업 길이 (분)</label>
            <input type="number" th:field="*{durationMinutes}" th:errorclass="field-error" min="1" max="1440" step="1" required aria-describedby="durationMinutesError durationHelp">
            <span id="durationMinutesError" class="error" th:errors="*{durationMinutes}"></span>
            <small id="durationHelp">1~1440분, 같은 요일의 24:00까지 끝나는 수업을 등록할 수 있습니다.</small>
        </p>
        <p><button type="submit">등록</button> <a href="/LessonSlot/new">새로 입력</a></p>
    </fieldset>
</form>
</body>
</html>
